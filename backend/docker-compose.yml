services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guzvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: guzvomator
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guzvo -d guzvomator"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://guzvo:${POSTGRES_PASSWORD}@db:5432/guzvomator
      API_KEY: ${API_KEY:?set API_KEY in .env}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
