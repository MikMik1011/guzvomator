[platformio]
default_envs = xiao_esp32c6

[env:xiao_esp32c6]
; pioarduino fork provides the Arduino core for ESP32-C6
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
lib_deps =
    h2zero/NimBLE-Arduino@^2
    https://github.com/djherceg/arduinoCmdProc.git

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<../lib/Scanner/src/WindowAggregator.cpp>
    +<../lib/Config/src/ParamSpec.cpp>
    +<../lib/Config/src/ParamCodec.cpp>
    +<../lib/Payload/src/Payload.cpp>
build_flags =
    -Ilib/Scanner/src
    -Ilib/Config/src
    -Ilib/Payload/src
    -Ilib/Sensors/src
    -Ilib/Net/src
    -Ilib/Cli/src
