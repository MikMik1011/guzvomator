[platformio]
default_envs = xiao_esp32c6

[env:xiao_esp32c6]
; pioarduino fork provides the Arduino core for ESP32-C6
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2
    https://github.com/djherceg/arduinoConfig.git
    https://github.com/djherceg/arduinoCmdProc.git
; arduinoConfig keeps its code in a nested lib/ and a demo src/main.cpp,
; so it cannot be built as a library directly
lib_extra_dirs = .pio/libdeps/${PIOENV}/arduinoConfig/lib
lib_ignore = arduinoConfig

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<../lib/Scanner/src/WindowAggregator.cpp>
build_flags = -Ilib/Scanner/src
